[project]
name = "bihaq"
version = "0.1.0"
description = "BIHAQ: Binaural Audio Quality prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio>=2.2 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scipy",
    "numpy<2",
]
